<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=2.0, user-scalable=no, viewport-fit=cover"
/>
<title>Dust水印相机</title>
<style>
    :root {
        --bg: #0e1116;
        --panel: #161a22;
        --line: #262c38;
        --text: #e7ebf2;
        --muted: #8b95a8;
        --accent: #5798ff;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 18px 16px 40px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 18px;
        align-items: start;
    }
    header { grid-column: 1 / -1; }
    h1 { font-size: 18px; margin: 0 0 2px; font-weight: 600; }
    h1 small { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 8px; }
    .stage { min-width: 0; }
    #dropZone {
        position: relative;
        background: #000;
        border: 1px dashed var(--line);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 220px;
    }
    #dropZone.dragover { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(87,152,255,.25) inset; }
    #preview { display: block; width: 100%; height: auto; }
    #preview.empty { display: none; }
    #hint { padding: 40px 18px; color: var(--muted); text-align: center; font-size: 13px; }
    #readout {
        margin-top: 10px;
        padding: 9px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 9px;
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.7;
        word-break: break-all;
    }
    #readout b { color: var(--text); font-weight: 600; }
    #thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .thumb { position: relative; width: 62px; height: 62px; border-radius: 8px; overflow: hidden; cursor: pointer; border: 2px solid transparent; background: #000; }
    .thumb.sel { border-color: var(--accent); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb i { position: absolute; top: 2px; right: 3px; width: 17px; height: 17px; line-height: 16px; text-align: center; border-radius: 5px; background: rgba(0,0,0,.6); font-style: normal; font-size: 12px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .group { padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
    .group:last-child { padding-bottom: 0; margin-bottom: 0; border-bottom: 0; }
    .group > h2 { font-size: 12px; color: var(--muted); margin: 0 0 10px; font-weight: 500; letter-spacing: .5px; }
    label.f { display: block; margin-bottom: 9px; font-size: 12.5px; color: var(--muted); }
    label.f > span { display: block; margin-bottom: 4px; }
    select, input[type="text"] {
        width: 100%;
        padding: 7px 9px;
        background: #0e1116;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 13px;
        font-family: inherit;
    }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row + .row { margin-top: 8px; }
    button {
        flex: 1 1 auto;
        padding: 8px 10px;
        background: #222936;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
    }
    button:hover { background: #2a3242; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #08101d; font-weight: 600; }
    button.primary:hover { filter: brightness(1.08); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .inline-out { color: var(--muted); font-size: 12px; min-width: 46px; text-align: right; }
    details.group > summary {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: .5px;
        cursor: pointer;
        list-style: none;
    }
    details.group > summary::-webkit-details-marker { display: none; }
    details.group > summary::before { content: '▸ '; }
    details.group[open] > summary::before { content: '▾ '; }
    details.group[open] > summary { margin-bottom: 4px; }
    .tset { margin-top: 11px; }
    .tset h3 { font-size: 12px; font-weight: 500; margin: 0 0 6px; color: var(--text); }
    .trow { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
    .trow > span { flex: 0 0 52px; font-size: 12px; color: var(--muted); }
    .trow input[type="range"] { flex: 1 1 auto; width: auto; }
    .trow output { flex: 0 0 48px; text-align: right; font-size: 11.5px; color: var(--muted); }
    footer { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; }
    #videoElement { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; }
    @media (max-width: 880px) {
        .wrap { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>Dust水印相机<small>导入照片 · 按照片尺寸与画面明暗自适应 · 原图分辨率烧录导出</small></h1>
    </header>

    <section class="stage">
        <div id="dropZone">
            <canvas id="preview" class="empty"></canvas>
            <div id="hint">把照片拖到这里 · 或 Ctrl + V 粘贴 · 或用右侧「导入照片」<br>支持多选、横图竖图全景图自动适配</div>
        </div>
        <div id="readout">尚未加载照片。</div>
        <div id="thumbs"></div>
    </section>

    <aside class="panel">
        <div class="group">
            <h2>照片</h2>
            <div class="row">
                <button id="pickBtn">导入照片</button>
                <button id="camBtn">使用相机</button>
            </div>
            <div class="row">
                <button id="exportBtn" class="primary" disabled>导出当前</button>
                <button id="exportAllBtn" disabled>批量导出</button>
            </div>
            <div class="row">
                <button id="clearBtn">清空列表</button>
            </div>
            <input type="file" id="fileInput" accept="image/*" multiple hidden>
        </div>

        <div class="group">
            <h2>自适应</h2>
            <label class="f"><span>水印位置</span>
                <select id="positionSel">
                    <option value="auto">自动（按画面明暗与杂乱度选位）</option>
                    <option value="bottom" selected>底部通栏</option>
                    <option value="top">顶部通栏</option>
                    <option value="bottom-left">左下</option>
                    <option value="bottom-right">右下</option>
                    <option value="top-left">左上</option>
                    <option value="top-right">右上</option>
                </select>
            </label>
            <label class="f"><span>底板衬底</span>
                <select id="scrimSel">
                    <option value="auto">自动（亮/乱区域才加）</option>
                    <option value="on">总是加</option>
                    <option value="off" selected>不加</option>
                </select>
            </label>
            <label class="f"><span>水印大小</span>
                <div class="row" style="align-items:center">
                    <input type="range" id="sizeRange" min="0.6" max="1.6" step="0.05" value="1">
                    <output class="inline-out" id="sizeOut">1.00×</output>
                </div>
            </label>
        </div>

        <details class="group">
            <summary>高级微调（字号与位置，默认折叠）</summary>
            <div id="tuneBody"></div>
            <div class="row"><button id="tuneReset">微调全部复位</button></div>
        </details>

        <div class="group">
            <h2>水印文字（改动即时生效）</h2>
            <label class="f"><span>A 时间</span><input type="text" id="inputA"></label>
            <label class="f"><span>B 地址</span><input type="text" id="inputB"></label>
            <label class="f"><span>C 日期</span><input type="text" id="inputC"></label>
            <div class="row"><button id="nowBtn">按当前时间刷新</button></div>
        </div>

        <div class="group">
            <div class="row"><button id="resetAllBtn">一键重置参数</button></div>
        </div>
    </aside>

    <footer>Copyright © <span id="year"></span> Dust水印相机</footer>
</div>

<video id="videoElement" autoplay playsinline muted></video>

    function loadSettings() {

        if (saved.position === 'auto' ||

            state.opts.position = saved.position;
        }
        if (saved.scrim === 'auto' || saved.scrim === 'on' || saved.scrim === 'off') {

        if (typeof saved.size === 'number' && isFinite(saved.size)) {
            state.opts.size = clamp(saved.size, 0.6, 1.6);
        }
        if (saved.tune && typeof saved.tune === 'object') {
            for (var k in TUNE_DEFAULT) {
                var group = saved.tune[k];
                if (!group || typeof group !== 'object') continue;
                for (var f in TUNE_DEFAULT[k]) {

                    }
                }
            }

        return d.getFullYear() + '.' + pad2(d.getMonth() + 1) + '.' + pad2(d.getDate()) + ' ' + days[d.getDay()];
    }

    // 底图拆成两块分别定位：左信息块贴左边，logo 贴右边，中间那段素材本就是空白
    function layout(W, H, key, opts) {
        var a = ANCHORS[key];
        var t = opts.tune;
        var min = Math.min(W, H);
        var margin = MARGIN_FRAC * min;
        var s = BLOCK_FRAC * min / ASSET_H * opts.size;
        // 整条宽度不能超过画面，否则竖图会把 logo 挤出右边
        s = Math.min(s, (W - 2 * margin) / (ASSET_W - INK_X));
        var h = ASSET_H * s;
        var lw = SPLIT_X * s;
        var rw = (ASSET_W - SPLIT_X) * s;
        var dx = t.bg.x * min;
        var dy = t.bg.y * min;
        var yBase = (a.edge === 'bottom' ? H - margin - h : margin) + dy;
        var left, logo;
        if (a.bleed) {
            left = { x: margin - INK_X * s + dx, y: yBase, w: lw, h: h };
            logo = { x: W - margin - rw + dx, y: yBase, w: rw, h: h };
        } else if (a.side === 'left') {
            left = { x: margin - INK_X * s + dx, y: yBase, w: lw, h: h };
            logo = { x: left.x + lw, y: yBase, w: rw, h: h };
        } else {
            logo = { x: W - margin - rw + dx, y: yBase, w: rw, h: h };
            left = { x: logo.x - lw, y: yBase, w: lw, h: h };
        }
        return {
            s: s,
            left: left,
            logo: logo,
            box: { x: left.x, y: yBase, w: logo.x + logo.w - left.x, h: h }
        };
    }

        for (var y = 0; y < GRID; y++) {
            for (var x = 0; x < GRID; x++) {
                var gx = (at(x + 1, y - 1) + 2 * at(x + 1, y) + at(x + 1, y + 1)) -
                         (at(x - 1, y - 1) + 2 * at(x - 1, y) + at(x - 1, y + 1));
                var gy = (at(x - 1, y + 1) + 2 * at(x, y + 1) + at(x + 1, y + 1)) -
                         (at(x - 1, y - 1) + 2 * at(x, y - 1) + at(x + 1, y - 1));
                grad[y * GRID + x] = Math.min(1, Math.sqrt(gx * gx + gy * gy) / 4);
            }
        }
        return { luma: luma, grad: grad };
    }

    function regionStats(map, box, W, H) {
        var x0 = clamp(Math.floor(box.x / W * GRID), 0, GRID - 1);
        var x1 = clamp(Math.ceil((box.x + box.w) / W * GRID), 1, GRID);
        var y0 = clamp(Math.floor(box.y / H * GRID), 0, GRID - 1);
        var y1 = clamp(Math.ceil((box.y + box.h) / H * GRID), 1, GRID);
        var vals = [];
        var gsum = 0;
        var n = 0;
        for (var cy = y0; cy < y1; cy++) {
            for (var cx = x0; cx < x1; cx++) {
                vals.push(map.luma[cy * GRID + cx]);
                gsum += map.grad[cy * GRID + cx];
                n++;
            }
        }
        if (!n) return { mean: 0, p90: 0, grad: 0 };
        vals.sort(function (m, k) { return m - k; });
        var pct = function (t) { return vals[Math.min(vals.length - 1, Math.floor(vals.length * t))]; };
        return { mean: pct(0.5), p90: pct(0.9), grad: gsum / n };
    }

    // 自动选位的尝试顺序：先保住这款水印的招牌构图，明显更优才让位
    var AUTO_ORDER = ['bottom', 'bottom-left', 'bottom-right', 'top', 'top-left', 'top-right'];
    var SWITCH_MARGIN = 0.1;

    function decide(map, W, H, opts) {
        var keys = opts.position === 'auto' ? AUTO_ORDER : [opts.position];
        var best = null;
        for (var i = 0; i < keys.length; i++) {
            var key = keys[i];
            var lay = layout(W, H, key, opts);
            var st = regionStats(map, lay.box, W, H);
            // 白字与底图素材都偏亮，风险来自局部过曝和细节过密，而非整块平均亮度
            var brightRisk = clamp((st.p90 - 0.55) / 0.35, 0, 1);
            var busy = clamp((st.grad - 0.10) / 0.30, 0, 1);
            var scrim = clamp(0.78 * brightRisk + 0.6 * Math.max(0, st.mean - 0.55) + 0.2 * busy, 0, 0.72);
            if (opts.scrim === 'off') scrim = 0;
            if (opts.scrim === 'on') scrim = Math.max(scrim, 0.5);
            var score = 1.9 * (1 - brightRisk) + 1.1 * (1 - busy) + 0.7 * (1 - st.mean) + ANCHORS[key].prior;
            if (!best || score > best.score + SWITCH_MARGIN) {
                best = {
                    key: key, lay: lay, left: lay.left, logo: lay.logo, box: lay.box, tune: opts.tune,
                    st: st, scrim: scrim, score: score, brightRisk: brightRisk, busy: busy
                };
            }
        }
        return best;
    }

    // ---------- 文字排版 ----------

    var FONT_STACK = '"Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif';

    function setFont(ctx, px, weight) {
        ctx.font = (weight || 700) + ' ' + px.toFixed(2) + 'px ' + FONT_STACK;
    }

    var NO_LINE_START = '。，、；：！？）】》”’’·…—%,.;:!?)]}~';

    function wrapText(ctx, text, maxW, maxLines) {
        var lines = [];
        var cur = '';
        var i = 0;
        while (i < text.length && lines.length < maxLines) {
            var ch = text.charAt(i);
            if (cur && ctx.measureText(cur + ch).width > maxW) {
                // 行首禁则：收尾标点跟着前一个字，宁可轻微溢出也不让它单独成行
                if (NO_LINE_START.indexOf(ch) >= 0 && cur.length > 1) {
                    cur += ch;
                    i++;
                }
                lines.push(cur);
                cur = '';
            } else {
                cur += ch;
                i++;
            }
        }
        if (cur && lines.length < maxLines) lines.push(cur);
        if (i < text.length && lines.length) {
            var last = lines[lines.length - 1];
            while (last && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1);
            lines[lines.length - 1] = last + '…';
        }
        return lines;
    }

    // 先小幅缩字，再折行；只靠缩字会把长地址压到不可读
    function fitText(ctx, text, maxW, basePx, minRatio, maxLines, weight) {
        if (!text) return { px: basePx, lines: [] };
        var floor = basePx * 0.8;
        var px = basePx;
        setFont(ctx, px, weight);
        if (ctx.measureText(text).width <= maxW) return { px: px, lines: [text] };
        while (px > floor) {
            px *= 0.94;
            setFont(ctx, px, weight);
            if (ctx.measureText(text).width <= maxW) return { px: px, lines: [text] };
        }
        px = floor;
        var minPx = basePx * minRatio;
        var lines, widest;
        do {
            setFont(ctx, px, weight);
            lines = wrapText(ctx, text, maxW, maxLines);
            widest = 0;
            for (var i = 0; i < lines.length; i++) widest = Math.max(widest, ctx.measureText(lines[i]).width);
            if (widest <= maxW) break;
            px *= 0.94;
        } while (px > minPx);
        return { px: px, lines: lines };
    }

    function drawLines(ctx, lines, px, cx, cy, outline) {
        var lh = px * 1.14;
        var start = cy - (lines.length - 1) * lh / 2;
        for (var i = 0; i < lines.length; i++) {
            if (outline) ctx.strokeText(lines[i], cx, start + i * lh);
            ctx.fillText(lines[i], cx, start + i * lh);
        }
    }

    // ---------- 绘制 ----------

    function roundRectPath(ctx, x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    // 衬底：通栏时铺满整条画面边缘，角落时只包住整块水印
    function drawScrim(ctx, plan, W, H, alpha) {
        var a = ANCHORS[plan.key];
        var b = plan.box;
        var padX = b.h * 0.05;
        var padY = b.h * 0.14;
        var x, y, w, h;
        if (a.bleed) {
            x = 0;
            w = W;
            if (a.edge === 'bottom') { y = b.y - padY; h = H - y; } else { y = 0; h = b.y + b.h + padY; }
        } else {
            x = b.x - padX;
            w = b.w + padX * 2;
            y = b.y - padY;
            h = b.h + padY * 2;
        }
        var g = ctx.createLinearGradient(0, a.edge === 'top' ? y : y + h, 0, a.edge === 'top' ? y + h : y);
        g.addColorStop(0, 'rgba(8,10,14,' + alpha + ')');
        g.addColorStop(0.55, 'rgba(8,10,14,' + alpha + ')');
        g.addColorStop(1, 'rgba(8,10,14,' + (alpha * 0.45).toFixed(3) + ')');
        ctx.fillStyle = g;
        roundRectPath(ctx, x, y, w, h, a.bleed ? 0 : b.h * 0.1);
        ctx.fill();
    }

    function render(ctx, W, H, src, plan, texts, code) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(src, 0, 0, W, H);

        var b = plan.left;
        var t = plan.tune;
        if (plan.scrim > 0.01) drawScrim(ctx, plan, W, H, plan.scrim);
        ctx.drawImage(stripImg, 0, 0, SPLIT_X, ASSET_H, b.x, b.y, b.w, b.h);
        ctx.drawImage(stripImg, SPLIT_X, 0, ASSET_W - SPLIT_X, ASSET_H,
            plan.logo.x, plan.logo.y, plan.logo.w, plan.logo.h);

        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';
        ctx.lineJoin = 'round';
        ctx.shadowColor = 'rgba(0,0,0,' + (plan.scrim > 0.25 ? 0.35 : 0.75) + ')';
        ctx.shadowBlur = b.h * 0.05;

        var tp = { x: b.x + b.w * (L.time.x + t.time.x), y: b.y + b.h * (L.time.y + t.time.y) };
        var time = fitText(ctx, texts.time, (b.x + b.w * 0.985 - tp.x) / TIME_SQUEEZE,
            b.h * L.time.size * t.time.size, 0.6, 1, 700);
        ctx.save();
        ctx.translate(tp.x, tp.y);
        ctx.scale(TIME_SQUEEZE, 1);
        setFont(ctx, time.px, 700);
        var tg = ctx.createLinearGradient(0, -time.px / 2, 0, time.px / 2);
        tg.addColorStop(0, '#0760d4');
        tg.addColorStop(1, '#000508');
        ctx.fillStyle = tg;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = time.px * 0.16;
        // 描边只留一层淡投影：底纹是浅色的，投影一重字就发糊
        ctx.shadowColor = 'rgba(0,0,0,0.45)';
        ctx.shadowBlur = time.px * 0.08;
        drawLines(ctx, time.lines, time.px, 0, 0, true);
        ctx.restore();

        var ap = { x: b.x + b.w * (L.addr.x + t.addr.x), y: b.y + b.h * (L.addr.y + t.addr.y) };
        var addr = fitText(ctx, texts.addr, b.x + b.w * 0.985 - ap.x, b.h * L.addr.size * t.addr.size, 0.55, 2, 400);
        ctx.fillStyle = '#ffffff';
        setFont(ctx, addr.px, 400);
        drawLines(ctx, addr.lines, addr.px, ap.x, ap.y);

        var dp = { x: b.x + b.w * (L.date.x + t.date.x), y: b.y + b.h * (L.date.y + t.date.y) };
        var date = fitText(ctx, texts.date, b.x + b.w * 0.985 - dp.x, b.h * L.date.size * t.date.size, 0.6, 1, 400);
        setFont(ctx, date.px, 400);
        drawLines(ctx, date.lines, date.px, dp.x, dp.y);

        if (code) {
            var lg = plan.logo;
            setFont(ctx, lg.h * L.code.size, 700);
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'left';
            ctx.shadowBlur = lg.h * 0.03;
            ctx.fillText(code, lg.x + lg.w * L.code.x, lg.y + lg.h * L.code.y);
        }
        ctx.restore();
        return { time: time, addr: addr, date: date };
    }

    // ---------- 预览 ----------

    function fitSize(w, h, max) {
        var s = Math.min(max / w, max / h, 1);
        return { w: Math.max(1, Math.round(w * s)), h: Math.max(1, Math.round(h * s)) };
    }

    function readout(desc, p, W, H, plan, fit) {
        var auto = state.opts.position === 'auto';
        var why = '';
        if (auto && plan.key !== 'bottom') {
            var bottom = decide(p.analysis, W, H, { position: 'bottom', scrim: state.opts.scrim, size: state.opts.size, tune: state.opts.tune });
            why = '，避开底部（底部 ' + bottom.score.toFixed(2) + ' 分 < 当前 ' + plan.score.toFixed(2) + ' 分）';
        }
        return '<b>' + p.w + '×' + p.h + '</b> ' + desc + ' ' + W + '×' + H +
            ' ｜ 位置 <b>' + ANCHOR_CN[plan.key] + '</b>' + (auto ? '（自动）' : '（手动）') + why +
            ' ｜ 衬底 <b>' + Math.round(plan.scrim * 100) + '%</b>' +
            ' ｜ 区域亮度 中位 ' + plan.st.mean.toFixed(2) + ' / P90 ' + plan.st.p90.toFixed(2) +
            ' ｜ 杂乱度 <b>' + plan.busy.toFixed(2) + '</b>' +
            ' ｜ 地址 ' + fit.addr.lines.length + ' 行 @ ' + Math.round(fit.addr.px) + 'px';
    }

    function showPhoto(p) {
        var size = fitSize(p.w, p.h, PREVIEW_MAX);
        preview.width = size.w;
        preview.height = size.h;
        preview.classList.remove('empty');
        $('hint').style.display = 'none';
        var plan = decide(p.analysis, size.w, size.h, state.opts);
        var fit = render(pctx, size.w, size.h, p.img, plan, state.texts, p.code);
        $('readout').innerHTML = readout('原图 / 预览', p, size.w, size.h, plan, fit);
    }

    function refresh() {
        if (state.cameraOn) return;
        var p = currentPhoto();
        if (p) showPhoto(p);
    }

    function currentPhoto() {
        return state.photos[state.current] || null;
    }

    // ---------- 相机 ----------

    function stopCamera() {
        if (state.stream) {
            state.stream.getTracks().forEach(function (t) { t.stop(); });
            state.stream = null;
        }
        cancelAnimationFrame(state.rafId);
        state.rafId = 0;
        state.cameraOn = false;
        state.camPlan = null;
        videoEl.srcObject = null;
    }

    function cameraLoop(ts) {
        if (!state.cameraOn) return;
        var v = videoEl;
        if (v.readyState >= 2 && v.videoWidth) {
            var size = fitSize(v.videoWidth, v.videoHeight, PREVIEW_MAX);
            if (preview.width !== size.w || preview.height !== size.h) {
                preview.width = size.w;
                preview.height = size.h;
                state.camPlan = null;
            }
            preview.classList.remove('empty');
            $('hint').style.display = 'none';
            var evaluated = false;
            if (!state.camPlan || ts - state.camPlanAt > 500) {
                state.camPlanAt = ts;
                evaluated = true;
                var map = analyze(v);
                var cand = decide(map, size.w, size.h, state.opts);
                // 只在明显更优时才换锚点，否则取景画面会逐帧抖动
                if (!state.camPlan || cand.score > state.camPlan.score + 0.12) {
                    cand.map = map;
                    state.camPlan = cand;
                }
            }
            var fit = render(pctx, size.w, size.h, v, state.camPlan, state.texts, sessionCode);
            if (evaluated) {
                $('readout').innerHTML = readout('取景 / 预览',
                    { analysis: state.camPlan.map, w: v.videoWidth, h: v.videoHeight },
                    size.w, size.h, state.camPlan, fit);
            }
        }
        state.rafId = requestAnimationFrame(cameraLoop);
    }

    function startCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            $('readout').textContent = '当前环境不支持 getUserMedia（需 https 或 localhost）。';
            return;
        }
        stopCamera();
        var constraints = { audio: false, video: { facingMode: { exact: 'environment' } } };
        navigator.mediaDevices.getUserMedia(constraints)
            .catch(function () {
                return navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: 'environment' } });
            })
            .then(function (stream) {
                state.stream = stream;
                state.cameraOn = true;
                videoEl.srcObject = stream;
                $('camBtn').textContent = '停止相机';
                state.rafId = requestAnimationFrame(cameraLoop);
            })
            .catch(function (err) {
                $('readout').textContent = '相机不可用：' + err.name + ' ' + err.message;
            });
    }

    // ---------- 导入 ----------

    var uid = 0;

    function addFiles(list) {
        var files = Array.prototype.slice.call(list).filter(function (f) {
            return f.type && f.type.indexOf('image/') === 0;
        });
        if (!files.length) return Promise.resolve(0);
        return Promise.all(files.map(function (f) {
            var url = URL.createObjectURL(f);
            var img = new Image();
            img.src = url;
            return whenLoaded(img).then(function () {
                return {
                    id: ++uid, name: f.name, img: img, url: url,
                    w: img.naturalWidth, h: img.naturalHeight,
                    analysis: analyze(img), code: randomCode(14)
                };
            }).catch(function () {
                URL.revokeObjectURL(url);
                return null;
            });
        })).then(function (added) {
            var ok = added.filter(Boolean);
            if (!ok.length) return 0;
            stopCamera();
            $('camBtn').textContent = '使用相机';
            state.photos = state.photos.concat(ok);
            selectPhoto(state.photos.length - ok.length);
            renderThumbs();
            return ok.length;
        });
    }

    function selectPhoto(i) {
        if (i < 0 || i >= state.photos.length) return;
        state.current = i;
        renderThumbs();
        showPhoto(state.photos[i]);
        $('exportBtn').disabled = false;
        $('exportAllBtn').disabled = state.photos.length < 2;
    }

    function renderThumbs() {
        var box = $('thumbs');
        box.innerHTML = '';
        state.photos.forEach(function (p, i) {
            var d = document.createElement('div');
            d.className = 'thumb' + (i === state.current ? ' sel' : '');
            d.title = p.name + ' (' + p.w + '×' + p.h + ')';
            var im = document.createElement('img');
            im.src = p.url;
            d.appendChild(im);
            var x = document.createElement('i');
            x.textContent = '×';
            x.addEventListener('click', function (e) {
                e.stopPropagation();
                URL.revokeObjectURL(p.url);
                state.photos.splice(i, 1);
                if (!state.photos.length) { state.current = -1; clearPreview(); }
                else selectPhoto(Math.min(i, state.photos.length - 1));
                renderThumbs();
            });
            d.appendChild(x);
            d.addEventListener('click', function () { selectPhoto(i); });
            box.appendChild(d);
        });
        $('exportAllBtn').disabled = state.photos.length < 2;
    }

    function clearPreview() {
        preview.classList.add('empty');
        $('hint').style.display = '';
        $('readout').textContent = '尚未加载照片。';
        $('exportBtn').disabled = true;
    }

    // ---------- 导出 ----------

    function exportCanvas(src, W, H, analysis, texts, code) {
        var c = document.createElement('canvas');
        c.width = W;
        c.height = H;
        var plan = decide(analysis, W, H, state.opts);
        render(c.getContext('2d'), W, H, src, plan, texts, code);
        return c;
    }

    function toBlob(canvas) {
        return new Promise(function (res, rej) {
            canvas.toBlob(function (b) { b ? res(b) : rej(new Error('编码失败')); }, 'image/jpeg', 0.94);
        });
    }

    function save(blob, name) {
        var a = document.createElement('a');
        var url = URL.createObjectURL(blob);
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    }

    function stamp() {
        var d = new Date();
        return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '_' + pad2(d.getHours()) + pad2(d.getMinutes());
    }

    function baseName(name) {
        return (name || 'photo').replace(/\.[^.]+$/, '').replace(/[\\/:*?"<>|\s]+/g, '_');
    }

    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function exportCurrent() {
        if (state.cameraOn) {
            if (!videoEl.videoWidth) return;
            finish(exportCanvas(videoEl, videoEl.videoWidth, videoEl.videoHeight, analyze(videoEl), state.texts, sessionCode),
                '相机_' + stamp() + '.jpg');
            return;
        }
        var p = currentPhoto();
        if (!p) return;
        finish(exportCanvas(p.img, p.w, p.h, p.analysis, state.texts, p.code), baseName(p.name) + '_水印_' + stamp() + '.jpg');
    }

    function finish(canvas, name) {
        $('readout').textContent = '正在导出 ' + name + ' …';
        toBlob(canvas).then(function (b) {
            save(b, name);
            $('readout').textContent = '已导出 ' + name + '（' + canvas.width + '×' + canvas.height + '，' + Math.round(b.size / 1024) + ' KB）';
        }).catch(function (e) {
            $('readout').textContent = '导出失败：' + e.message;
        });
    }

    function exportAll() {
        var list = state.photos.slice();
        var i = 0;
        $('exportAllBtn').disabled = true;
        (function next() {
            if (i >= list.length) {
                $('exportAllBtn').disabled = false;
                $('readout').textContent = '批量导出完成，共 ' + list.length + ' 张。';
                return;
            }
            var p = list[i++];
            var no = i;
            $('readout').textContent = '批量导出 ' + no + '/' + list.length + '：' + p.name;
            toBlob(exportCanvas(p.img, p.w, p.h, p.analysis, state.texts, p.code))
                .then(function (b) { save(b, baseName(p.name) + '_水印_' + stamp() + '.jpg'); })
                .catch(function (e) { $('readout').textContent = '第 ' + no + ' 张失败：' + e.message; })
                .then(function () { return sleep(400); })
                .then(next);
        })();
    }

    // ---------- 控件 ----------

    var sessionCode = randomCode(14);

    function tuneLabel(field, v) {
        v = parseFloat(v);
        if (TUNE_RANGE[field].unit === '×') return v.toFixed(2) + '×';
        return (v > 0 ? '+' : '') + Math.round(v * 100) + '%';
    }

    function syncTune() {
        TUNE_SPEC.forEach(function (g) {
            g.fields.forEach(function (f) {
                var v = state.opts.tune[g.key][f[0]];
                $('tune_' + g.key + '_' + f[0]).value = v;
                $('tuneo_' + g.key + '_' + f[0]).textContent = tuneLabel(f[0], v);
            });
        });
    }

    function buildTune() {
        var host = $('tuneBody');
        TUNE_SPEC.forEach(function (g) {
            var set = document.createElement('div');
            set.className = 'tset';
            var h = document.createElement('h3');
            h.textContent = g.title;
            set.appendChild(h);
            g.fields.forEach(function (f) {
                var r = TUNE_RANGE[f[0]];
                var row = document.createElement('div');
                row.className = 'trow';
                row.innerHTML = '<span>' + f[1] + '</span>' +
                    '<input type="range" id="tune_' + g.key + '_' + f[0] + '"' +
                    ' min="' + r.min + '" max="' + r.max + '" step="' + r.step + '">' +
                    '<output id="tuneo_' + g.key + '_' + f[0] + '"></output>';
                set.appendChild(row);
            });
            host.appendChild(set);
        });
        syncTune();
        TUNE_SPEC.forEach(function (g) {
            g.fields.forEach(function (f) {
                $('tune_' + g.key + '_' + f[0]).addEventListener('input', function (e) {
                    state.opts.tune[g.key][f[0]] = parseFloat(e.target.value);
                    $('tuneo_' + g.key + '_' + f[0]).textContent = tuneLabel(f[0], e.target.value);
                    state.camPlan = null;
                    saveSettings();
                    refresh();
                });
            });
        });
        $('tuneReset').addEventListener('click', function () {
            state.opts.tune = tuneDefaults();
            syncTune();
            state.camPlan = null;
            saveSettings();
            refresh();
        });
    }

    function bindUI() {
        $('pickBtn').addEventListener('click', function () { $('fileInput').click(); });
        $('fileInput').addEventListener('change', function (e) {
            addFiles(e.target.files);
            e.target.value = '';
        });
        $('camBtn').addEventListener('click', function () {
            if (state.cameraOn) {
                stopCamera();
                $('camBtn').textContent = '使用相机';
                var p = currentPhoto();
                if (p) showPhoto(p); else clearPreview();
            } else {
                startCamera();
            }
        });
        $('exportBtn').addEventListener('click', exportCurrent);
        $('exportAllBtn').addEventListener('click', exportAll);
        $('clearBtn').addEventListener('click', function () {
            state.photos.forEach(function (p) { URL.revokeObjectURL(p.url); });
            state.photos = [];
            state.current = -1;
            renderThumbs();
            clearPreview();
        });
        $('positionSel').addEventListener('change', function (e) {
            state.opts.position = e.target.value;
            state.camPlan = null;
            saveSettings();
            refresh();
        });
        $('scrimSel').addEventListener('change', function (e) {
            state.opts.scrim = e.target.value;
            state.camPlan = null;
            saveSettings();
            refresh();
        });
        $('sizeRange').addEventListener('input', function (e) {
            state.opts.size = parseFloat(e.target.value);
            $('sizeOut').textContent = state.opts.size.toFixed(2) + '×';
            state.camPlan = null;
            saveSettings();
            refresh();
        });
        ['inputA', 'inputB', 'inputC'].forEach(function (id, i) {
            $(id).addEventListener('input', function (e) {
                state.texts[['time', 'addr', 'date'][i]] = e.target.value;
                if (i === 1) saveSettings();
                refresh();
            });
        });
        $('nowBtn').addEventListener('click', function () {
            state.texts.time = nowTime();
            state.texts.date = nowDate();
            $('inputA').value = state.texts.time;
            $('inputC').value = state.texts.date;
            sessionCode = randomCode(14);
            var p = currentPhoto();
            if (p) p.code = randomCode(14);
            refresh();
        });

        $('resetAllBtn').addEventListener('click', resetSettings);

        buildTune();

        var zone = $('dropZone');
        document.addEventListener('dragover', function (e) {
            e.preventDefault();
            zone.classList.add('dragover');
        });
        document.addEventListener('dragleave', function () { zone.classList.remove('dragover'); });
        document.addEventListener('drop', function (e) {
            e.preventDefault();
            zone.classList.remove('dragover');
            if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
        });
        document.addEventListener('paste', function (e) {
            var f = e.clipboardData && e.clipboardData.files;
            if (f && f.length) { e.preventDefault(); addFiles(f); }
        });
    }

    // ---------- 启动 ----------

    function boot() {
        $('year').textContent = new Date().getFullYear();
        state.texts.time = nowTime();
        state.texts.date = nowDate();
        state.texts.addr = DEFAULT_ADDR;
        loadSettings();
        $('positionSel').value = state.opts.position;
        $('scrimSel').value = state.opts.scrim;
        $('sizeRange').value = state.opts.size;
        $('sizeOut').textContent = state.opts.size.toFixed(2) + '×';
        $('inputA').value = state.texts.time;
        $('inputB').value = state.texts.addr;
        $('inputC').value = state.texts.date;
        bindUI();
        whenLoaded(stripImg).then(function () {
            $('readout').textContent = '可以导入了：拖拽、粘贴或点「导入照片」。水印尺寸会按照片自动适配，位置与衬底见右侧选项。';
        }).catch(function () {
            $('readout').textContent = '水印底图未能加载，导出将只有文字部分。';
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
    } else {
        boot();
    }
})();
</script>
</body>
</html>
